<script>

/* ===== HALLOWEEN MUSIC ===== */

let audioContext;
let masterGain;
let musicTimer;
let musicOn = false;

const melody = [
  196, 196, 233, 261,
  233, 196, 174, 155,

  196, 233, 261, 293,
  261, 233, 196, 174,

  155, 174, 196, 233,
  261, 233, 196, 174,

  196, 233, 196, 174,
  155, 174, 155, 147
];

let melodyIndex = 0;

function createNote(frequency, duration = 0.45, volume = 0.12, type = "square") {

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(
    frequency,
    audioContext.currentTime
  );

  gain.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    audioContext.currentTime + 0.025
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(masterGain);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + duration
  );
}


/* 🦴 Низький spooky бас */

function createBass(frequency) {

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "triangle";

  oscillator.frequency.setValueAtTime(
    frequency,
    audioContext.currentTime
  );

  gain.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.09,
    audioContext.currentTime + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + 0.5
  );

  oscillator.connect(gain);
  gain.connect(masterGain);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.55
  );
}


/* 👻 Маленький Halloween дзвіночок */

function createBell(frequency) {

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";

  oscillator.frequency.setValueAtTime(
    frequency * 2,
    audioContext.currentTime
  );

  gain.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.07,
    audioContext.currentTime + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + 0.35
  );

  oscillator.connect(gain);
  gain.connect(masterGain);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.4
  );
}


function playHalloweenBeat() {

  const note = melody[melodyIndex];

  createNote(
    note,
    0.42,
    0.13,
    "square"
  );

  /* бас кожні 2 ноти */

  if (melodyIndex % 2 === 0) {

    const bassNotes = [
      98,
      87,
      77,
      98
    ];

    const bass =
      bassNotes[
        Math.floor(melodyIndex / 8) % bassNotes.length
      ];

    createBass(bass);
  }

  /* дзвіночки */

  if (
    melodyIndex === 3 ||
    melodyIndex === 11 ||
    melodyIndex === 19 ||
    melodyIndex === 27
  ) {

    createBell(note);
  }

  melodyIndex++;

  if (melodyIndex >= melody.length) {
    melodyIndex = 0;
  }
}


function startMusic() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    masterGain =
      audioContext.createGain();

    masterGain.gain.value = 0.28;

    masterGain.connect(
      audioContext.destination
    );
  }

  if (
    audioContext.state === "suspended"
  ) {
    audioContext.resume();
  }

  if (musicTimer) {
    clearInterval(musicTimer);
  }

  melodyIndex = 0;

  playHalloweenBeat();

  musicTimer = setInterval(
    playHalloweenBeat,
    330
  );
}


function stopMusic() {

  if (musicTimer) {

    clearInterval(
      musicTimer
    );

    musicTimer = null;
  }
}


async function toggleMusic() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    masterGain =
      audioContext.createGain();

    masterGain.gain.value = 0.28;

    masterGain.connect(
      audioContext.destination
    );
  }

  if (
    audioContext.state === "suspended"
  ) {

    await audioContext.resume();
  }

  if (!musicOn) {

    musicOn = true;

    startMusic();

    document.getElementById(
      "musicButton"
    ).innerText =
      "🔇 Stop music";

  } else {

    musicOn = false;

    stopMusic();

    document.getElementById(
      "musicButton"
    ).innerText =
      "🎃 Music";
  }
}

</script>
